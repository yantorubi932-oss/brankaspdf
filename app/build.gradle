plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.dc2cell.brankaspdf'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dc2cell.brankaspdf'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
def supabaseUrl = project.findProperty('SUPABASE_URL') ?: ''
def supabaseKey = project.findProperty('SUPABASE_PUBLISHABLE_KEY') ?: ''

buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrl + '"'
buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"' + supabaseKey + '"'    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.camera:camera-core:1.7.1'
    implementation 'androidx.camera:camera-camera2:1.7.1'
    implementation 'androidx.camera:camera-lifecycle:1.7.1'
    implementation 'androidx.camera:camera-view:1.7.1'

    implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.01'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    implementation platform('io.github.jan-tennert.supabase:bom:3.0.2')
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.github.jan-tennert.supabase:storage-kt'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
}
